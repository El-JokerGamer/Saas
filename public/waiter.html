<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النادل — [اسم المنصة]</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="container">
    <a class="logo" href="index.html">[اسم المنصة]<small>منصة إدارة المطاعم عبر QR</small></a>
    <nav><a href="index.html">الرئيسية</a><a href="menu.html">القائمة</a><a href="kitchen.html">المطبخ</a></nav>
  </div>
</header>
<main class="container">
  <h1>🧑‍💼 النادل</h1>
  <p class="muted">الطلبات الجاهزة بحسب الطاولة — اضغط «تم التقديم» بعد وصول الطلب إلى الطاولة.</p>
  <label>المطعم</label>
  <select id="restSelect"></select>
  <div id="orders"></div>
  <section>
    <h2>طلبات تم تقديمها اليوم</h2>
    <div id="served"></div>
  </section>
</main>
<footer>تُحدَّث القائمة تلقائيًا كل 3 ثوانٍ</footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  let restaurantId = QR.param('restaurant') || 'r1';
  const sel = document.getElementById('restSelect');
  function fillSel() {
    const rs = QR.getRestaurants();
    sel.innerHTML = rs.map((r) => `<option value="${r.id}" ${r.id === restaurantId ? 'selected' : ''}>${QR.esc(r.name)}</option>`).join('');
  }
  sel.onchange = () => { restaurantId = sel.value; render(); };
  function render() {
    fillSel();
    const all = QR.getOrders().filter((o) => o.restaurantId === restaurantId);
    const ready = all.filter((o) => o.status === 'ready');
    const served = all.filter((o) => o.status === 'served');
    document.getElementById('orders').innerHTML = ready.length ? ready.map((o) => `
      <div class="card" style="margin-bottom:12px">
        <strong>طاولة ${o.table}</strong> · <span class="muted">${QR.timeOf(o.createdAt)} · ${o.id}</span>
        <span class="pill ready">${QR.statusLabel(o.status)}</span>
        <ul>${o.items.map((i) => `<li>${QR.esc(i.name)} × ${i.qty}</li>`).join('')}</ul>
        <p><strong>الإجمالي: ${QR.fmt(o.total)}</strong></p>
        <button class="btn" onclick="serve('${o.id}')">تم التقديم ✓</button>
      </div>`).join('') : '<p class="muted">لا توجد طلبات جاهزة حاليًا.</p>';
    document.getElementById('served').innerHTML = served.length ? served.map((o) => `
      <div class="card" style="margin-bottom:10px"><strong>طاولة ${o.table}</strong> · ${QR.timeOf(o.createdAt)} · <span class="pill served">${QR.statusLabel(o.status)}</span> · ${QR.fmt(o.total)}</div>`).join('') : '<p class="muted">لم يتم تقديم أي طلب بعد.</p>';
  }
  window.serve = (id) => { QR.setOrderStatus(id, 'served'); render(); };
  render();
  QR.onOrdersChange(render);
})();
</script>
</body>
</html>

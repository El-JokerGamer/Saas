<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدير المطعم — [اسم المنصة]</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="container">
    <a class="logo" href="index.html">[اسم المنصة]<small>منصة إدارة المطاعم عبر QR</small></a>
    <nav><a href="index.html">الرئيسية</a><a href="kitchen.html">المطبخ</a><a href="waiter.html">النادل</a></nav>
  </div>
</header>
<main class="container">
  <h1>📋 مدير المطعم</h1>
  <label>المطعم</label>
  <select id="restSelect"></select>

  <section>
    <h2>إحصائيات اليوم</h2>
    <div class="grid" id="stats"></div>
  </section>

  <section>
    <h2>إدارة القائمة</h2>
    <div class="card">
      <label>الاسم</label><input id="itemName" placeholder="مثال: كباب حلبي">
      <label>التصنيف</label><select id="itemCat"></select>
      <label>السعر (جنيه)</label><input id="itemPrice" type="number" min="0" placeholder="220">
      <label>الوصف</label><input id="itemDesc" placeholder="وصف مختصر">
      <button class="btn" onclick="addItem()">إضافة صنف</button>
    </div>
    <div id="menuList" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>الطاولات ورموز QR</h2>
    <p class="muted">امسح الرمز بكاميرا هاتفك لفتح قائمة الطاولة مباشرة. انسخ رابط الطاولة واطبعه مع الرمز.</p>
    <div class="grid" id="tables"></div>
  </section>

  <section>
    <h2>الطلبات</h2>
    <div id="orders"></div>
  </section>
</main>
<footer>التعديلات تُحفظ محليًا في متصفحك (localStorage)</footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  let restaurantId = QR.param('restaurant') || 'r1';
  const sel = document.getElementById('restSelect');
  function fillSel() {
    const rs = QR.getRestaurants();
    sel.innerHTML = rs.map((r) => `<option value="${r.id}" ${r.id === restaurantId ? 'selected' : ''}>${QR.esc(r.name)}</option>`).join('');
  }
  sel.onchange = () => { restaurantId = sel.value; render(); };

  function render() {
    fillSel();
    const rest = QR.getRestaurants().find((r) => r.id === restaurantId);
    const menu = QR.getMenu(restaurantId);
    const orders = QR.getOrders().filter((o) => o.restaurantId === restaurantId);
    const revenue = orders.filter((o) => o.status === 'served').reduce((s, o) => s + o.total, 0);
    document.getElementById('stats').innerHTML = `
      <div class="card"><div class="stat">${orders.length}</div><div class="muted">إجمالي الطلبات</div></div>
      <div class="card"><div class="stat">${orders.filter((o) => o.status === 'new').length}</div><div class="muted">طلبات جديدة</div></div>
      <div class="card"><div class="stat">${orders.filter((o) => o.status === 'served').length}</div><div class="muted">تم تقديمها</div></div>
      <div class="card"><div class="stat">${QR.fmt(revenue)}</div><div class="muted">إيراد الطلبات المقدَّمة</div></div>`;

    document.getElementById('itemCat').innerHTML = menu.categories.map((c) => `<option value="${c.id}">${QR.esc(c.name)}</option>`).join('');
    document.getElementById('menuList').innerHTML = menu.items.map((it) => {
      const cat = menu.categories.find((c) => c.id === it.category);
      return `<div class="card" style="margin-bottom:10px"><div class="menu-item"><div><strong>${QR.esc(it.name)}</strong> <span class="muted">(${QR.esc(cat ? cat.name : '')})</span><br><span class="muted">${QR.esc(it.desc || '')}</span></div><span class="price">${QR.fmt(it.price)}</span></div><button class="btn ghost small" onclick="delItem('${it.id}')">حذف</button></div>`;
    }).join('');

    const base = location.origin + location.pathname.replace('manager.html', 'menu.html');
    document.getElementById('tables').innerHTML = (rest.tables || []).map((t) => {
      const url = base + '?restaurant=' + restaurantId + '&table=' + t;
      const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
      return `<div class="card qr"><h3>طاولة ${t}</h3><img src="${qr}" alt="QR طاولة ${t}" width="180" height="180"><p style="word-break:break-all"><a href="${url}">${url}</a></p><button class="btn small ghost" onclick="navigator.clipboard && navigator.clipboard.writeText('${url}')">نسخ الرابط</button></div>`;
    }).join('');

    document.getElementById('orders').innerHTML = orders.length ? orders.slice().reverse().map((o) => `
      <div class="card" style="margin-bottom:10px"><strong>طاولة ${o.table}</strong> · ${QR.timeOf(o.createdAt)} · <span class="pill ${o.status}">${QR.statusLabel(o.status)}</span> · ${QR.fmt(o.total)}<br><span class="muted">${o.items.map((i) => QR.esc(i.name) + ' ×' + i.qty).join('، ')}</span></div>`).join('') : '<p class="muted">لا توجد طلبات بعد.</p>';
  }

  window.addItem = () => {
    const name = document.getElementById('itemName').value.trim();
    const price = Number(document.getElementById('itemPrice').value);
    if (!name || !price) return alert('أدخل الاسم والسعر.');
    const menu = QR.getMenu(restaurantId);
    menu.items.push({ id: 'i' + Date.now().toString(36), category: document.getElementById('itemCat').value, name, desc: document.getElementById('itemDesc').value.trim(), price });
    QR.saveMenu(restaurantId, menu);
    document.getElementById('itemName').value = ''; document.getElementById('itemPrice').value = ''; document.getElementById('itemDesc').value = '';
    render();
  };
  window.delItem = (id) => {
    if (!confirm('حذف هذا الصنف؟')) return;
    const menu = QR.getMenu(restaurantId);
    menu.items = menu.items.filter((it) => it.id !== id);
    QR.saveMenu(restaurantId, menu); render();
  };
  render();
  QR.onOrdersChange(render);
})();
</script>
</body>
</html>
